<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>mopslipper 管理ツール</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap"
    />
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <header class="top">
      <div class="top-inner">
        <p class="brand"><span id="site-name">mopslipper</span> <small>管理ツール</small></p>
        <nav class="tabs" aria-label="管理メニュー">
          <a href="#requests" data-tab="requests">リクエスト<span class="tab-count" id="tab-count-requests" hidden></span></a>
          <a href="#works" data-tab="works">作品</a>
          <a href="#site" data-tab="site">サイト</a>
          <a href="#publish" data-tab="publish">公開<span class="tab-count" id="tab-count-publish" hidden></span></a>
        </nav>
        <a class="preview-link" id="preview-link" target="_blank" rel="noopener" hidden>サイトを確認 ↗</a>
      </div>
    </header>

    <main id="view" tabindex="-1">
      <p class="loading">読み込み中…</p>
    </main>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <dialog class="confirm" id="confirm-dialog">
      <form method="dialog">
        <h2 id="confirm-title"></h2>
        <p id="confirm-message"></p>
        <div class="row end">
          <button class="btn btn-ghost" value="cancel" id="confirm-cancel">やめる</button>
          <button class="btn btn-primary" value="ok" id="confirm-ok">OK</button>
        </div>
      </form>
    </dialog>

    <noscript>この管理ツールを使うには JavaScript を有効にしてください。</noscript>
    <script type="module" src="/assets/js/app.js"></script>
  </body>
</html>
